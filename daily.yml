name: 每日盤後更新

on:
  schedule:
    - cron: '0 7 * * 1-5'   # 台北時間每週一到週五 15:00
  workflow_dispatch:         # 也可以在 Actions 分頁手動按執行

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node build.mjs
      - name: 提交結果
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || git commit -m "盤後更新 $(TZ=Asia/Taipei date +%F)"
          git push
